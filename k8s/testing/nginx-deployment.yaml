apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
      initContainers:
      - name: init
        image: zerokoll/fearofoblivioninit
        env:
          - name: PAT
            value: "tokenxxx"
        volumeMounts:
          - mountPath: /opt
            name: web
      volumes:
        - name: web
          emptyDir: { }

